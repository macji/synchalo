name: SyncHalo CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-14
            tauri_args: --target aarch64-apple-darwin --bundles app,dmg
          - name: Ubuntu ARM64
            os: ubuntu-24.04-arm
            tauri_args: --target aarch64-unknown-linux-gnu --bundles deb,appimage

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Install Ubuntu Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || 'aarch64-unknown-linux-gnu' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Build native Tauri bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npm run tauri -- build ${{ matrix.tauri_args }}

      - uses: actions/upload-artifact@v7
        with:
          name: synchalo-${{ matrix.name }}
          path: |
            target/**/release/bundle/**/*.app
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.AppImage
          if-no-files-found: error
