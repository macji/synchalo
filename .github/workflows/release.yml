name: Publish Linux and Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to validate/build; all requires a version tag
        required: true
        default: main
        type: string
      target:
        description: Work to run; single-platform builds only upload Actions artifacts
        required: true
        default: all
        type: choice
        options:
          - linux
          - windows
          - all
          - validate-only

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', inputs.ref, inputs.target) || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  metadata:
    name: Resolve build source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      target: ${{ steps.release.outputs.target }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - id: release
        name: Validate version metadata
        env:
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
          REQUESTED_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$REQUESTED_REF"
          target="$REQUESTED_TARGET"
          if [[ -z "$source_ref" ]]; then
            echo "Build source ref must not be empty" >&2
            exit 1
          fi
          case "$target" in
            linux|windows|all|validate-only) ;;
            *)
              echo "Invalid workflow target: $target" >&2
              exit 1
              ;;
          esac

          tauri_version="$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)"
          root_npm_version="$(jq -r '.version' package.json)"
          desktop_npm_version="$(jq -r '.version' apps/desktop/package.json)"
          lock_version="$(jq -r '.version' package-lock.json)"
          lock_root_version="$(jq -r '.packages[""] | .version' package-lock.json)"
          lock_desktop_version="$(jq -r '.packages["apps/desktop"] | .version' package-lock.json)"
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"

          for version in \
            "$root_npm_version" \
            "$desktop_npm_version" \
            "$lock_version" \
            "$lock_root_version" \
            "$lock_desktop_version" \
            "$cargo_version"; do
            if [[ "$version" != "$tauri_version" ]]; then
              echo "Project version mismatch: expected $tauri_version, found $version" >&2
              exit 1
            fi
          done
          commit="$(git rev-parse HEAD)"
          tag=""
          prerelease=false
          if [[ "$target" == "all" ]]; then
            tag="${source_ref#refs/tags/}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "The all target requires a version tag, got: $source_ref" >&2
              exit 1
            fi
            if [[ "$tag" != "v$tauri_version" ]]; then
              echo "Tag $tag does not match application version v$tauri_version" >&2
              exit 1
            fi
            tag_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
            if [[ "$commit" != "$tag_commit" ]]; then
              echo "Checked-out commit does not match $tag" >&2
              exit 1
            fi
            if [[ "$tag" == *-* ]]; then
              prerelease=true
            fi
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "version=$tauri_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  preflight:
    name: Verify publishing credentials
    needs: metadata
    runs-on: ubuntu-latest
    env:
      APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
      APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE }}
    steps:
      - name: Require credentials for a complete release
        if: needs.metadata.outputs.target == 'all'
        shell: bash
        run: |
          set -euo pipefail
          required=(
            APT_GPG_FINGERPRINT
            APT_GPG_PASSPHRASE
            APT_GPG_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          )
          case "$WINDOWS_SIGNING_MODE" in
            signpath)
              required+=(SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID)
              ;;
            unsigned)
              echo "::warning::Windows installers will be unsigned while SignPath approval is pending."
              ;;
            *)
              echo "WINDOWS_SIGNING_MODE must be explicitly set to signpath or unsigned." >&2
              exit 1
              ;;
          esac
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required release credential: $name" >&2
              exit 1
            fi
          done

  verify:
    name: Verify release source
    needs: [metadata, preflight]
    if: needs.metadata.outputs.target == 'all' || needs.metadata.outputs.target == 'validate-only'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apt-utils \
            dpkg-dev \
            gnupg \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash -n scripts/*.sh
      - run: tests/release/deb_apt_bootstrap_smoke.sh
      - run: tests/release/apt_repository_smoke.sh

  build-linux:
    name: Build Ubuntu ${{ matrix.display_arch }}
    needs: [metadata, preflight]
    if: needs.metadata.outputs.target == 'all' || needs.metadata.outputs.target == 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - display_arch: ARM64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            deb_arch: arm64
            asset_arch: arm64
          - display_arch: x86_64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            asset_arch: x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: release-ubuntu-${{ matrix.deb_arch }}

      - run: npm ci

      - name: Build Ubuntu bundles
        run: >-
          npm run tauri -- build
          --target ${{ matrix.rust_target }}
          --bundles deb

      - name: Verify and package Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="target/${{ matrix.rust_target }}/release/bundle"
          deb="$(find "$bundle_root/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"

          dpkg-deb --info "$deb" >/dev/null
          test "$(dpkg-deb -f "$deb" Architecture)" = "${{ matrix.deb_arch }}"
          tests/release/deb_apt_bootstrap_smoke.sh "$deb"

          mkdir -p release-assets
          install -m 0644 "$deb" \
            "release-assets/SyncHalo_${RELEASE_VERSION}_ubuntu-${{ matrix.asset_arch }}.deb"

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.deb_arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x64
    needs: [metadata, preflight]
    if: needs.metadata.outputs.target == 'all' || needs.metadata.outputs.target == 'windows'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    outputs:
      signed: ${{ steps.signing-result.outputs.enabled }}
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: release-windows-x64

      - run: npm ci

      - name: Build Windows installers
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri -- build `
            --target x86_64-pc-windows-msvc `
            --bundles nsis,msi
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          $bundleRoot = "target/x86_64-pc-windows-msvc/release/bundle"
          $msi = Get-ChildItem "$bundleRoot/msi/*.msi" | Select-Object -First 1
          $exe = Get-ChildItem "$bundleRoot/nsis/*.exe" | Select-Object -First 1
          if ($null -eq $msi -or $null -eq $exe) {
            throw "Expected MSI and NSIS installers were not produced."
          }

          New-Item -ItemType Directory -Force release-assets,signpath-input | Out-Null
          $version = $env:RELEASE_VERSION
          $msiOutput = "release-assets/SyncHalo_${version}_windows-x64.msi"
          $exeOutput = "release-assets/SyncHalo_${version}_windows-x64-setup.exe"
          $msiSignature = "$($msi.FullName).sig"
          $exeSignature = "$($exe.FullName).sig"
          if (-not (Test-Path $msiSignature) -or -not (Test-Path $exeSignature)) {
            throw "Expected updater signatures were not produced."
          }
          Copy-Item $msi.FullName $msiOutput
          Copy-Item $exe.FullName $exeOutput
          Copy-Item $msiSignature "$msiOutput.sig"
          Copy-Item $exeSignature "$exeOutput.sig"
          Copy-Item $msiOutput signpath-input
          Copy-Item $exeOutput signpath-input

      - id: upload-unsigned-windows
        name: Upload unsigned installers for SignPath
        if: needs.metadata.outputs.target == 'all' && vars.WINDOWS_SIGNING_MODE == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: signpath-input-windows-x64
          path: signpath-input/*
          if-no-files-found: error
          retention-days: 1

      - name: Sign installers with SignPath Foundation
        if: needs.metadata.outputs.target == 'all' && vars.WINDOWS_SIGNING_MODE == 'signpath'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: synchalo
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installers
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signpath-output
          parameters: |
            version: ${{ toJSON(needs.metadata.outputs.version) }}

      - name: Verify SignPath signatures and refresh updater signatures
        if: needs.metadata.outputs.target == 'all' && vars.WINDOWS_SIGNING_MODE == 'signpath'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $expected = @(
            "SyncHalo_$($env:RELEASE_VERSION)_windows-x64.msi",
            "SyncHalo_$($env:RELEASE_VERSION)_windows-x64-setup.exe"
          )
          foreach ($name in $expected) {
            $signed = Get-ChildItem signpath-output -Recurse -File -Filter $name | Select-Object -First 1
            if ($null -eq $signed) {
              throw "SignPath output does not contain $name."
            }
            $destination = Join-Path release-assets $name
            Copy-Item $signed.FullName $destination -Force
            $signature = Get-AuthenticodeSignature $destination
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for ${name}: $($signature.Status)"
            }
            if ($signature.SignerCertificate.Subject -notmatch "SignPath Foundation") {
              throw "Unexpected Authenticode publisher for ${name}: $($signature.SignerCertificate.Subject)"
            }
            Remove-Item "$destination.sig" -Force
            & npm run tauri -- signer sign $destination
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$destination.sig")) {
              throw "Could not regenerate the updater signature for $name."
            }
          }

      - id: signing-result
        name: Record Windows signing status
        shell: pwsh
        run: |
          $isSignPathRelease = "${{ needs.metadata.outputs.target }}" -eq "all" -and "${{ vars.WINDOWS_SIGNING_MODE }}" -eq "signpath"
          if ($isSignPathRelease) {
            "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Warning "Windows artifacts are unsigned."
          }

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish-apt:
    name: Publish signed APT repository
    needs: [metadata, preflight, verify, build-linux]
    if: |
      always() &&
      needs.metadata.result == 'success' &&
      needs.preflight.result == 'success' &&
      needs.verify.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.metadata.outputs.target == 'all'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    env:
      APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
      APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - uses: actions/download-artifact@v8
        with:
          pattern: release-linux-*
          path: linux-assets
          merge-multiple: true

      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg

      - name: Build and sign APT repository
        shell: bash
        run: scripts/build-apt-repository.sh linux-assets site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - id: deployment
        name: Deploy APT repository to GitHub Pages
        uses: actions/deploy-pages@v5

  publish:
    name: Publish GitHub Release
    needs: [metadata, preflight, verify, build-linux, build-windows, publish-apt]
    if: |
      always() &&
      needs.metadata.result == 'success' &&
      needs.preflight.result == 'success' &&
      needs.verify.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.publish-apt.result == 'success' &&
      needs.metadata.outputs.target == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      WINDOWS_SIGNED: ${{ needs.build-windows.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.commit }}

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' \
            > SHA256SUMS.txt
          cd ..

          if [[ "$WINDOWS_SIGNED" == "true" ]]; then
            windows_status="SignPath Foundation Authenticode signed"
          else
            windows_status="unsigned while SignPath approval is pending; Windows may display an Unknown publisher or SmartScreen warning"
          fi
          previous_tag="$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            changes="$(git log --format='- %s' "$previous_tag..$RELEASE_TAG")"
          else
            changes="$(git log -n 20 --format='- %s' "$RELEASE_TAG")"
          fi
          cat > release-notes.md <<EOF
          SyncHalo ${RELEASE_VERSION}

          Changes:

          ${changes}

          Platform packages:

          - Ubuntu Desktop ARM64 and x86_64: DEB with automatic signed APT enrollment and signed APT repository
          - Windows x64: MSI and NSIS setup executable (${windows_status})

          Signed updater artifacts are included for Windows installations. Ubuntu confirms updates in-app, then installs through Polkit-authorized APT.

          Verify downloads with \`SHA256SUMS.txt\`.
          EOF

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GH_REPO"
            gh release edit "$RELEASE_TAG" \
              --title "SyncHalo $RELEASE_TAG" \
              --notes-file release-notes.md \
              --repo "$GH_REPO"
          else
            args=(
              release create "$RELEASE_TAG"
              release-assets/*
              --verify-tag
              --title "SyncHalo $RELEASE_TAG"
              --notes-file release-notes.md
              --repo "$GH_REPO"
            )
            if [[ "${{ needs.metadata.outputs.prerelease }}" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi
          echo "Published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$RELEASE_TAG" \
            >> "$GITHUB_STEP_SUMMARY"
