name: Publish Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - id: release
        name: Validate version metadata
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          tauri_version="$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)"
          root_npm_version="$(jq -r '.version' package.json)"
          desktop_npm_version="$(jq -r '.version' apps/desktop/package.json)"
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"

          for version in "$root_npm_version" "$desktop_npm_version" "$cargo_version"; do
            if [[ "$version" != "$tauri_version" ]]; then
              echo "Project version mismatch: expected $tauri_version, found $version" >&2
              exit 1
            fi
          done
          if [[ "$tag" != "v$tauri_version" ]]; then
            echo "Tag $tag does not match application version v$tauri_version" >&2
            exit 1
          fi

          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$tauri_version" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify release source
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build-macos:
    name: Build macOS ARM64
    needs: [metadata, verify]
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Require Apple signing and notarization secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_ID
            APPLE_KEYCHAIN_PASSWORD
            APPLE_PASSWORD
            APPLE_TEAM_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          intermediate_path="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          keychain_path="$RUNNER_TEMP/synchalo-build.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" \
            | openssl base64 -d -A -out "$certificate_path"
          curl --fail --location --silent --show-error \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$intermediate_path"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$intermediate_path" -k "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
              | head -n 1
          )"
          if [[ -z "$identity" ]]; then
            echo "No valid Developer ID Application identity was imported" >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: release-macos-arm64

      - run: npm ci

      - name: Build, sign, and notarize macOS bundles
        run: >-
          npm run tauri -- build
          --target aarch64-apple-darwin
          --bundles app,dmg

      - name: Verify and package macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="target/aarch64-apple-darwin/release/bundle"
          app="$bundle_root/macos/SyncHalo.app"
          dmg="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -d "$app"
          test -n "$dmg"

          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute -vv "$app"
          xcrun stapler validate "$dmg"

          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" \
            "release-assets/SyncHalo_${RELEASE_VERSION}_macos-arm64.zip"
          cp "$dmg" "release-assets/SyncHalo_${RELEASE_VERSION}_macos-arm64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Ubuntu ARM64
    needs: [metadata, verify]
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: release-ubuntu-arm64

      - run: npm ci

      - name: Build Ubuntu bundles
        run: >-
          npm run tauri -- build
          --target aarch64-unknown-linux-gnu
          --bundles deb,appimage

      - name: Verify and package Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="target/aarch64-unknown-linux-gnu/release/bundle"
          deb="$(find "$bundle_root/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find "$bundle_root/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"

          dpkg-deb --info "$deb" >/dev/null
          file "$appimage" | grep -q 'ELF.*ARM aarch64'

          mkdir -p release-assets
          install -m 0644 "$deb" \
            "release-assets/SyncHalo_${RELEASE_VERSION}_ubuntu-arm64.deb"
          install -m 0755 "$appimage" \
            "release-assets/SyncHalo_${RELEASE_VERSION}_linux-arm64.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x64
    needs: [metadata, verify]
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - id: signing
        name: Detect Windows signing certificate
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Warning "WINDOWS_CERTIFICATE is not configured; Windows installers will be unsigned."
          } else {
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
              throw "WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE is set."
            }
            "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Import optional Windows signing certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "synchalo-signing.pfx"
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.windows.signing.json"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString `
            $env:WINDOWS_CERTIFICATE_PASSWORD `
            -AsPlainText `
            -Force
          $certificate = @(
            Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password
          ) | Where-Object HasPrivateKey | Select-Object -First 1
          if ($null -eq $certificate) {
            throw "The imported PFX does not contain a signing identity with a private key."
          }

          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
                tsp = $true
              }
            }
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 $configPath
          "WINDOWS_SIGNING_CONFIG=$configPath" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: release-windows-x64

      - run: npm ci

      - name: Build Windows installers
        shell: pwsh
        run: |
          $arguments = @(
            "run", "tauri", "--", "build",
            "--target", "x86_64-pc-windows-msvc",
            "--bundles", "nsis,msi"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CONFIG)) {
            $arguments += @("--config", $env:WINDOWS_SIGNING_CONFIG)
          }
          & npm @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify and package Windows artifacts
        shell: pwsh
        run: |
          $bundleRoot = "target/x86_64-pc-windows-msvc/release/bundle"
          $msi = Get-ChildItem "$bundleRoot/msi/*.msi" | Select-Object -First 1
          $exe = Get-ChildItem "$bundleRoot/nsis/*.exe" | Select-Object -First 1
          if ($null -eq $msi -or $null -eq $exe) {
            throw "Expected MSI and NSIS installers were not produced."
          }

          New-Item -ItemType Directory -Force release-assets | Out-Null
          $version = $env:RELEASE_VERSION
          $msiOutput = "release-assets/SyncHalo_${version}_windows-x64.msi"
          $exeOutput = "release-assets/SyncHalo_${version}_windows-x64-setup.exe"
          Copy-Item $msi.FullName $msiOutput
          Copy-Item $exe.FullName $exeOutput

          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            foreach ($path in @($msiOutput, $exeOutput)) {
              $signature = Get-AuthenticodeSignature $path
              if ($signature.Status -ne "Valid") {
                throw "Invalid Authenticode signature for ${path}: $($signature.Status)"
              }
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [metadata, verify, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      WINDOWS_SIGNED: ${{ needs.build-windows.outputs.signed }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' \
            > SHA256SUMS.txt
          cd ..

          if [[ "$WINDOWS_SIGNED" == "true" ]]; then
            windows_status="Authenticode signed"
          else
            windows_status="Unsigned; Windows may display a SmartScreen warning"
          fi
          cat > release-notes.md <<EOF
          SyncHalo ${RELEASE_VERSION}

          Platform packages:

          - macOS ARM64: Developer ID signed and Apple notarized ZIP and DMG
          - Ubuntu Desktop ARM64: DEB and AppImage
          - Windows x64: MSI and NSIS setup executable (${windows_status})

          Verify downloads with \`SHA256SUMS.txt\`.
          EOF

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "SyncHalo $RELEASE_TAG" \
              --notes-file release-notes.md
          else
            args=(
              release create "$RELEASE_TAG"
              release-assets/*
              --verify-tag
              --title "SyncHalo $RELEASE_TAG"
              --notes-file release-notes.md
            )
            if [[ "${{ needs.metadata.outputs.prerelease }}" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi
          echo "Published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$RELEASE_TAG" \
            >> "$GITHUB_STEP_SUMMARY"
