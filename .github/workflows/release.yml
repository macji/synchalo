name: Publish Linux and Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to validate/build; all requires a version tag
        required: true
        default: main
        type: string
      target:
        description: Work to run; single-platform builds only upload Actions artifacts
        required: true
        default: all
        type: choice
        options:
          - linux
          - windows
          - all
          - validate-only

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', inputs.ref, inputs.target) || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  metadata:
    name: Resolve build source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      target: ${{ steps.release.outputs.target }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - id: release
        name: Validate version metadata
        env:
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
          REQUESTED_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$REQUESTED_REF"
          target="$REQUESTED_TARGET"
          if [[ -z "$source_ref" ]]; then
            echo "Build source ref must not be empty" >&2
            exit 1
          fi
          case "$target" in
            linux|windows|all|validate-only) ;;
            *)
              echo "Invalid workflow target: $target" >&2
              exit 1
              ;;
          esac

          tauri_version="$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)"
          root_npm_version="$(jq -r '.version' package.json)"
          desktop_npm_version="$(jq -r '.version' apps/desktop/package.json)"
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"

          for version in "$root_npm_version" "$desktop_npm_version" "$cargo_version"; do
            if [[ "$version" != "$tauri_version" ]]; then
              echo "Project version mismatch: expected $tauri_version, found $version" >&2
              exit 1
            fi
          done
          commit="$(git rev-parse HEAD)"
          tag=""
          prerelease=false
          if [[ "$target" == "all" ]]; then
            tag="${source_ref#refs/tags/}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "The all target requires a version tag, got: $source_ref" >&2
              exit 1
            fi
            if [[ "$tag" != "v$tauri_version" ]]; then
              echo "Tag $tag does not match application version v$tauri_version" >&2
              exit 1
            fi
            tag_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
            if [[ "$commit" != "$tag_commit" ]]; then
              echo "Checked-out commit does not match $tag" >&2
              exit 1
            fi
            if [[ "$tag" == *-* ]]; then
              prerelease=true
            fi
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "version=$tauri_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release source
    needs: metadata
    if: needs.metadata.outputs.target == 'all' || needs.metadata.outputs.target == 'validate-only'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build-linux:
    name: Build Ubuntu ARM64
    needs: metadata
    if: needs.metadata.outputs.target == 'all' || needs.metadata.outputs.target == 'linux'
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: release-ubuntu-arm64

      - run: npm ci

      - name: Build Ubuntu bundles
        run: >-
          npm run tauri -- build
          --target aarch64-unknown-linux-gnu
          --bundles deb,appimage

      - name: Verify and package Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="target/aarch64-unknown-linux-gnu/release/bundle"
          deb="$(find "$bundle_root/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find "$bundle_root/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"

          dpkg-deb --info "$deb" >/dev/null
          file "$appimage" | grep -q 'ELF.*ARM aarch64'

          mkdir -p release-assets
          install -m 0644 "$deb" \
            "release-assets/SyncHalo_${RELEASE_VERSION}_ubuntu-arm64.deb"
          install -m 0755 "$appimage" \
            "release-assets/SyncHalo_${RELEASE_VERSION}_linux-arm64.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x64
    needs: metadata
    if: needs.metadata.outputs.target == 'all' || needs.metadata.outputs.target == 'windows'
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - id: signing
        name: Detect Windows signing certificate
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Warning "WINDOWS_CERTIFICATE is not configured; Windows installers will be unsigned."
          } else {
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
              throw "WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE is set."
            }
            "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Import optional Windows signing certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "synchalo-signing.pfx"
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.windows.signing.json"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString `
            $env:WINDOWS_CERTIFICATE_PASSWORD `
            -AsPlainText `
            -Force
          $certificate = @(
            Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password
          ) | Where-Object HasPrivateKey | Select-Object -First 1
          if ($null -eq $certificate) {
            throw "The imported PFX does not contain a signing identity with a private key."
          }

          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
                tsp = $true
              }
            }
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 $configPath
          "WINDOWS_SIGNING_CONFIG=$configPath" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: release-windows-x64

      - run: npm ci

      - name: Build Windows installers
        shell: pwsh
        run: |
          $arguments = @(
            "run", "tauri", "--", "build",
            "--target", "x86_64-pc-windows-msvc",
            "--bundles", "nsis,msi"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CONFIG)) {
            $arguments += @("--config", $env:WINDOWS_SIGNING_CONFIG)
          }
          & npm @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify and package Windows artifacts
        shell: pwsh
        run: |
          $bundleRoot = "target/x86_64-pc-windows-msvc/release/bundle"
          $msi = Get-ChildItem "$bundleRoot/msi/*.msi" | Select-Object -First 1
          $exe = Get-ChildItem "$bundleRoot/nsis/*.exe" | Select-Object -First 1
          if ($null -eq $msi -or $null -eq $exe) {
            throw "Expected MSI and NSIS installers were not produced."
          }

          New-Item -ItemType Directory -Force release-assets | Out-Null
          $version = $env:RELEASE_VERSION
          $msiOutput = "release-assets/SyncHalo_${version}_windows-x64.msi"
          $exeOutput = "release-assets/SyncHalo_${version}_windows-x64-setup.exe"
          Copy-Item $msi.FullName $msiOutput
          Copy-Item $exe.FullName $exeOutput

          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            foreach ($path in @($msiOutput, $exeOutput)) {
              $signature = Get-AuthenticodeSignature $path
              if ($signature.Status -ne "Valid") {
                throw "Invalid Authenticode signature for ${path}: $($signature.Status)"
              }
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [metadata, verify, build-linux, build-windows]
    if: |
      always() &&
      needs.metadata.result == 'success' &&
      needs.verify.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.metadata.outputs.target == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      WINDOWS_SIGNED: ${{ needs.build-windows.outputs.signed }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' \
            > SHA256SUMS.txt
          cd ..

          if [[ "$WINDOWS_SIGNED" == "true" ]]; then
            windows_status="Authenticode signed"
          else
            windows_status="Unsigned; Windows may display a SmartScreen warning"
          fi
          cat > release-notes.md <<EOF
          SyncHalo ${RELEASE_VERSION}

          Platform packages:

          - Ubuntu Desktop ARM64: DEB and AppImage
          - Windows x64: MSI and NSIS setup executable (${windows_status})

          Verify downloads with \`SHA256SUMS.txt\`.
          EOF

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GH_REPO"
            gh release edit "$RELEASE_TAG" \
              --title "SyncHalo $RELEASE_TAG" \
              --notes-file release-notes.md \
              --repo "$GH_REPO"
          else
            args=(
              release create "$RELEASE_TAG"
              release-assets/*
              --verify-tag
              --title "SyncHalo $RELEASE_TAG"
              --notes-file release-notes.md
              --repo "$GH_REPO"
            )
            if [[ "${{ needs.metadata.outputs.prerelease }}" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi
          echo "Published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$RELEASE_TAG" \
            >> "$GITHUB_STEP_SUMMARY"
