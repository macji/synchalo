[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/core",
  "crates/network",
  "crates/platform",
  "crates/storage",
  "crates/transfer",
]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.26", features = ["serde", "v4", "v7"] }
zeroize = "1.8"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
