[package]
name = "synchalo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "synchalo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
keyring = "4.2"
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
synchalo-core = { path = "../../../crates/core" }
synchalo-network = { path = "../../../crates/network" }
synchalo-platform = { path = "../../../crates/platform" }
synchalo-storage = { path = "../../../crates/storage" }
synchalo-transfer = { path = "../../../crates/transfer" }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-updater = "2.11.0"
tempfile = "3.26"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true
zeroize.workspace = true
